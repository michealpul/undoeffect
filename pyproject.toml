[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "michealpul-undoeffect"
version = "0.1.0"
description = "按结构键把条目聚类，标出智能体外部副作用的撤销上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "michealpul" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://michealpul.github.io"
Repository = "https://github.com/michealpul/undoeffect"
Issues = "https://github.com/michealpul/undoeffect/issues"

[project.scripts]
undoeffect = "undoeffect:main"

[tool.setuptools]
py-modules = ["undoeffect"]
